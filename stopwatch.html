<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탑워치</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 48px 64px;
      background: #1a1a1a;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      min-width: 420px;
    }

    h1 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 40px;
    }

    .display {
      font-size: 84px;
      font-weight: 100;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: #fff;
      line-height: 1;
      margin-bottom: 48px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.5px;
    }

    button:active {
      transform: scale(0.95);
    }

    #startBtn {
      background: #4ade80;
      color: #000;
      min-width: 110px;
    }

    #startBtn:hover { background: #22c55e; }

    #startBtn.running { background: #f87171; color: #000; }
    #startBtn.running:hover { background: #ef4444; }

    #lapBtn {
      background: #262626;
      color: #ccc;
    }

    #lapBtn:hover:not(:disabled) { background: #333; }
    #lapBtn:disabled { opacity: 0.25; cursor: not-allowed; }

    #resetBtn {
      background: #262626;
      color: #ccc;
    }

    #resetBtn:hover { background: #333; }

    .laps {
      margin-top: 32px;
      max-height: 230px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .laps::-webkit-scrollbar { width: 3px; }
    .laps::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 2px;
      border-bottom: 1px solid #222;
      font-size: 13px;
      color: #777;
      animation: drop 0.18s ease;
    }

    .lap-item .lap-num { color: #444; min-width: 44px; text-align: left; }
    .lap-item .lap-split { font-variant-numeric: tabular-nums; }
    .lap-item .lap-total { font-variant-numeric: tabular-nums; color: #555; min-width: 80px; text-align: right; }

    .lap-item.fastest .lap-split { color: #4ade80; }
    .lap-item.slowest  .lap-split { color: #f87171; }

    @keyframes drop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stopwatch</h1>
    <div class="display" id="display">00:00.00</div>
    <div class="buttons">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
      <button id="resetBtn">초기화</button>
    </div>
    <div class="laps" id="laps"></div>
  </div>

  <script>
    let startTime = 0, elapsed = 0, interval = null, running = false;
    let laps = [], lastLap = 0;

    const display  = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const lapBtn   = document.getElementById('lapBtn');
    const resetBtn = document.getElementById('resetBtn');
    const lapsEl   = document.getElementById('laps');

    function fmt(ms) {
      const cs = Math.floor(ms / 10) % 100;
      const s  = Math.floor(ms / 1000) % 60;
      const m  = Math.floor(ms / 60000) % 60;
      const h  = Math.floor(ms / 3600000);
      const pad = n => String(n).padStart(2, '0');
      return (h ? `${pad(h)}:` : '') + `${pad(m)}:${pad(s)}.${pad(cs)}`;
    }

    function tick() {
      elapsed = Date.now() - startTime;
      display.textContent = fmt(elapsed);
    }

    function start() {
      startTime = Date.now() - elapsed;
      interval = setInterval(tick, 10);
      running = true;
      startBtn.textContent = '정지';
      startBtn.classList.add('running');
      lapBtn.disabled = false;
    }

    function stop() {
      clearInterval(interval);
      running = false;
      startBtn.textContent = '계속';
      startBtn.classList.remove('running');
    }

    function reset() {
      clearInterval(interval);
      running = false; elapsed = 0; lastLap = 0; laps = [];
      display.textContent = '00:00.00';
      startBtn.textContent = '시작';
      startBtn.classList.remove('running');
      lapBtn.disabled = true;
      lapsEl.innerHTML = '';
    }

    function addLap() {
      const split = elapsed - lastLap;
      lastLap = elapsed;
      laps.push({ total: elapsed, split });
      renderLaps();
    }

    function renderLaps() {
      const splits  = laps.map(l => l.split);
      const minSplit = Math.min(...splits);
      const maxSplit = Math.max(...splits);
      lapsEl.innerHTML = '';
      [...laps].reverse().forEach((lap, ri) => {
        const num  = laps.length - ri;
        const item = document.createElement('div');
        item.className = 'lap-item';
        if (laps.length > 1) {
          if (lap.split === minSplit) item.classList.add('fastest');
          else if (lap.split === maxSplit) item.classList.add('slowest');
        }
        item.innerHTML = `
          <span class="lap-num">랩 ${num}</span>
          <span class="lap-split">${fmt(lap.split)}</span>
          <span class="lap-total">${fmt(lap.total)}</span>`;
        lapsEl.appendChild(item);
      });
    }

    startBtn.addEventListener('click', () => running ? stop() : start());
    resetBtn.addEventListener('click', reset);
    lapBtn.addEventListener('click', () => { if (running) addLap(); });
  </script>
</body>
</html>
